[server]
showEmailPrompt = false
# Local only: the app runs a model on this machine, so do not serve it to the network.
address = "localhost"

[runner]
# No full garbage collection after every script run. It holds the GIL for 100-250 ms in this process, and a run ends as
# a question starts and on every redraw while one is live: the agent's thread then cannot read the vLLM stream, whose
# tokens arrive all at once, at thousands of tok/s. release_model() collects when a model goes.
postScriptGC = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme.light]
primaryColor = "#b73d23"
backgroundColor = "#f4f0e6"
secondaryBackgroundColor = "#ebe5d6"
textColor = "#18212b"
borderColor = "#d8d0bf"
linkColor = "#2f5191"
codeBackgroundColor = "#ebe5d6"

[theme.dark]
primaryColor = "#e3795f"
backgroundColor = "#14181d"
secondaryBackgroundColor = "#252c36"
textColor = "#e8e3d8"
borderColor = "#333a44"
linkColor = "#93b3f0"
codeBackgroundColor = "#252c36"
