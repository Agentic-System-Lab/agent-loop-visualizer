[project]
name = "agent-loop-visualizer"
version = "0.1.0"
description = "Chat with a local agent and watch every step of its loop"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.10",
    "httpx>=0.27",
    "pygments>=2.21.0",
    "streamlit>=1.66.1",
    "torch>=2.6",
    "torchvision>=0.29.1",
    "transformers>=5.5",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["model: loads the real Gemma weights; set RUN_MODEL_TESTS=1 to run"]
