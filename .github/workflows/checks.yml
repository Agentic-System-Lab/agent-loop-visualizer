# Checks every push and pull request: ruff's lint (the order of imports with it), mypy's types, and the tests that
# load no weights and touch no network (the ones that need the models, Docker's images, a vLLM server or pi skip).
# mypy and the tests import the whole app, so the job first installs every package uv.lock pins, torch among them.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: pyproject.toml  # its required-version: no uv older than the fix for the revoked emSign certificates
      - id: sync
        run: uv sync --locked
      # Each runs even when the one before failed, so that one push reports all three.
      - run: uv run ruff check
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest
